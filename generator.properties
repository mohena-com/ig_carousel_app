EDITORIAL VALIDATION:

- Slide 1 creates a strong but factual hook.
- Slide 2 is easy to scan.
- Slide 3 clearly communicates eligibility.
- Slide 4 clearly communicates fee/pay/selection information actually available.
- Slide 5 clearly communicates application and important dates.
- Slide 6 clearly communicates official links and application guidance.
- The six slides feel like one coherent editorial story.

